
<!DOCTYPE html>
<html>
<head>
  <title>kathryn's computer</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="computer_search.png">

  <style>
    /* Movable desktop objects */
    .movable {
      width: 100px;
      border: none;
      padding: 0;
      background-color: transparent;
      text-align: center;
      position: absolute;
      cursor: pointer;
      user-select: none;
      pointer-events: auto;
      display: inline-block;
      z-index: 100;
    }

    /* Dotted border when dragging */
    .dragging {
      border-style: dotted;
      border-width: 2.5px;
    }

    /* Folder images */
    .movable img {
      display: block;
      margin: 0 auto;
      width: 60px;
      height: auto;
    }

    /* Blue tint for specific folders */
    .blue-tint img {
      filter: hue-rotate(180deg) brightness(0.8);
    }

    /* Folder labels */
    .text-container {
      background-color: transparent;
      padding: 5px;
      display: inline-block;
      margin-top: 5px;
    }

    .text-container p {
      margin: 0;
      font-family: 'Roboto Mono', monospace;
      font-size: 12px;
      background-color: transparent;
      color: #ffffff;
    }

    body {
      font-family: 'Roboto Mono', monospace;
      font-size: 12px;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    /* Central logo */
    .home-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50%;
      text-align: center;
    }

    .home-logo img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Toolbar iframe */
    iframe {
      border: none;
      width: 100%;
      height: 100px;
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 10000;
      pointer-events: none;
    }

    #menu {
      z-index: 10001;
    }

    /* Mobile adjustments */
    @media screen and (max-width: 600px) {

      .home-logo {
        width: 85vw;
        max-width: 420px;
      }

      .home-logo img {
        width: 100%;
        max-height: 24vh;
        object-fit: contain;
      }

      .movable {
        width: 110px !important;
      }

      .movable img {
        width: 85px;
      }

      .text-container p {
        font-size: 14px;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }

      /* Top folders */
      #object1 {
        left: 5px !important;
        top: 20px !important;
      }

      #object2 {
        left: auto !important;
        right: 5px;
        top: 20px !important;
      }

      /* About and CV */
      #object6 {
        left: 5px !important;
        top: 200px !important;
      }

      #object7 {
        left: auto !important;
        right: 5px;
        top: 200px !important;
      }

      /* Lower folders */
      #object3,
      #object4,
      #object5 {
        top: auto !important;
        bottom: 85px;
      }

      #object3 {
        left: 5px !important;
      }

      #object4 {
        left: calc(50% - 55px) !important;
      }

      #object5 {
        left: auto !important;
        right: 5px;
      }
    }
  </style>
</head>

<body onload="setBackground()">

  <div class="home-logo">
    <img src="kathrynzix.png">
  </div>

  <script>
    var backgroundColors = ["#29716B", "#065F73"];

    function setBackground() {
      var i = Math.floor(Math.random() * backgroundColors.length);
      document.body.style.backgroundColor = backgroundColors[i];
    }

    // Adjust iframe height based on menu height
    function adjustIframeHeight(height) {
      const iframe = document.querySelector('iframe');
      iframe.style.height = height + 'px';
    }

    // Listen for messages from the iframe
    window.addEventListener('message', (event) => {
      if (event.data.type === 'menu') {
        const iframe = document.querySelector('iframe');
        iframe.style.height = event.data.height + 'px';
        iframe.style.pointerEvents = 'none';
      }
    });

    function enableIframePointerEvents() {
      const iframe = document.querySelector('iframe');
      iframe.style.pointerEvents = 'auto';
    }

    function disableIframePointerEvents() {
      const iframe = document.querySelector('iframe');
      iframe.style.pointerEvents = 'none';
    }

    // Initial iframe height
    window.addEventListener('load', () => {
      const iframe = document.querySelector('iframe');
      iframe.style.height = '100px';
    });

    // Enable toolbar interaction after clicks
    document.addEventListener('click', () => {
      enableIframePointerEvents();
    });
  </script>

  <iframe src="toolbar.html" frameborder="0"></iframe>

  <div>
    <!-- Movable folders -->

    <div class="movable" id="object1" style="left: 10px; top: 50px;">
      <img src="clock.png" draggable="false">
      <div class="text-container">
        <p>library of alternative timekeeping</p>
      </div>
    </div>

    <div class="movable" id="object2" style="left: 10px; top: 220px;">
      <img src="newspaper.png" draggable="false">
      <div class="text-container">
        <p>estate sale</p>
      </div>
    </div>

    <div class="movable" id="object6" style="left: 10px; top: 390px;">
      <img src="msagent-3.png" draggable="false">
      <div class="text-container">
        <p>about</p>
      </div>
    </div>

    <div class="movable" id="object7" style="left: 10px; top: 560px;">
      <img src="cv.png" draggable="false">
      <div class="text-container">
        <p>cv</p>
      </div>
    </div>

    <div class="movable" id="object3" style="left: calc(100% - 160px); top: calc(100% - 220px);">
      <img src="camera_directory.png" draggable="false">
      <div class="text-container">
        <p>photo</p>
      </div>
    </div>

    <div class="movable" id="object4" style="left: calc(100% - 310px); top: calc(100% - 220px);">
      <img src="directory_movie-5.png" draggable="false">
      <div class="text-container">
        <p>video</p>
      </div>
    </div>

    <div class="movable" id="object5" style="left: calc(100% - 460px); top: calc(100% - 220px);">
      <img src="webfolder.png" draggable="false">
      <div class="text-container">
        <p>web art</p>
      </div>
    </div>

    <!-- Dragging and navigation -->

    <script>
      const movables = document.querySelectorAll('.movable');

      movables.forEach(movable => {
        let isDragging = false;
        let offsetX = 0;
        let offsetY = 0;
        let dragged = false;
        let isClicking = false;

        movable.addEventListener('pointerdown', (e) => {
          movable.style.zIndex = getHighestZIndex() + 1;

          isDragging = true;
          dragged = false;
          isClicking = true;

          offsetX = e.offsetX;
          offsetY = e.offsetY;

          movable.classList.add('dragging');
        });

        document.addEventListener('pointermove', (e) => {
          if (isDragging) {
            dragged = true;
            movable.style.left = (e.pageX - offsetX) + 'px';
            movable.style.top = (e.pageY - offsetY) + 'px';
          }
        });

        movable.addEventListener('pointerup', (e) => {
          if (dragged && isClicking) {
            e.preventDefault();
          }

          if (!isDragging) {
            movable.classList.remove('dragging');
            movable.blur();
          }

          isDragging = false;
          isClicking = false;

          movable.classList.remove('dragging');
          movable.blur();
        });

        movable.addEventListener('click', (e) => {
          if (dragged || isDragging) {
            e.preventDefault();
            return;
          }

          switch (movable.id) {
            case 'object1':
              window.location.href = 'library%20of%20alternative%20timekeeping/library_of_alternative_timekeeping.html';
              break;

            case 'object2':
              window.location.href = 'estate sale/estate_sale.html';
              break;

            case 'object3':
              window.location.href = 'photo.html';
              break;

            case 'object4':
              window.location.href = 'video.html';
              break;

            case 'object5':
              window.location.href = 'web_art.html';
              break;

            case 'object6':
              window.location.href = 'about.html';
              break;

            case 'object7':
              window.location.href = 'cv.html';
              break;
          }
        });
      });

      function getHighestZIndex() {
        let highestZIndex = 0;
        const elements = document.querySelectorAll('*');

        elements.forEach(el => {
          const zIndex = window.getComputedStyle(el).zIndex;

          if (!isNaN(zIndex) && zIndex > highestZIndex) {
            highestZIndex = zIndex;
          }
        });

        return highestZIndex;
      }
    </script>
  </div>

</body>
</html>
