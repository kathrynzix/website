
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      font-family: 'Roboto Mono', monospace;
    }

    :root {
      --toolbar-height: 40px;
    }

    #toolbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: var(--toolbar-height);
      background-color: #c0c0c0;
      border-top: 1px solid #808080;
      display: flex;
      align-items: center;
      padding: 0 10px;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.2);
      z-index: 10000;
      gap: 0;
    }

    #menuButton {
      background-color: #192fd3;
      color: #ffffff;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      font-family: 'Roboto Mono', monospace;
      font-size: 14px;
      flex-shrink: 0;
    }

    #menu {
      display: none;
      position: absolute;
      bottom: var(--toolbar-height);
      left: 10px;
      background-color: #c0c0c0;
      border: 1px solid #808080;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      padding: 10px;
      font-family: 'Roboto Mono', monospace;
      font-size: 12px;
      z-index: 10001;
      max-height: 300px;
      overflow-y: auto;
    }

    #menu a {
      display: block;
      padding: 5px;
      color: #000000;
      text-decoration: none;
    }

    #menu a:hover {
      background-color: #d0d0d0;
    }

    .toolbar-link {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-left: 10px;
    }

    .toolbar-icon {
      display: block;
      width: 25px;
      height: auto;
      cursor: pointer;
    }

    /* Mobile toolbar */
    @media screen and (max-width: 600px) {

      :root {
        --toolbar-height: 56px;
      }

      #toolbar {
        padding: 0 7px;
      }

      #menuButton {
        font-size: 15px;
        padding: 8px 10px;
      }

      .toolbar-link {
        width: 39px;
        height: 46px;
        margin-left: 3px;
      }

      .toolbar-icon {
        width: clamp(29px, 9vw, 35px);
      }

      #menu {
        left: 7px;
        font-size: 14px;
        padding: 10px;
        max-height: none;
        overflow-y: visible;
      }

      #menu a {
        padding: 9px 7px;
      }
    }
  </style>
</head>

<body>

  <div id="toolbar">

    <button id="menuButton">Menu</button>

    <!-- Computer Search Icon -->
    <a class="toolbar-link" href="index.html" target="_parent">
      <img src="computer_search.png" alt="Search Icon" class="toolbar-icon">
    </a>

    <!-- Clock Icon -->
    <a class="toolbar-link" href="library of alternative timekeeping/library_of_alternative_timekeeping.html" target="_parent">
      <img src="clock.png" alt="Library Icon" class="toolbar-icon" id="clockIcon">
    </a>

    <!-- Newspaper Icon -->
    <a class="toolbar-link" href="estate sale/estate_sale.html" target="_parent">
      <img src="newspaper.png" alt="Newspaper Icon" class="toolbar-icon">
    </a>

    <!-- Web Art Icon -->
    <a class="toolbar-link" href="web_art.html" target="_parent">
      <img src="webfolder.png" alt="Web Art Icon" class="toolbar-icon">
    </a>

    <!-- Video Art Icon -->
    <a class="toolbar-link" href="video.html" target="_parent">
      <img src="directory_movie-5.png" alt="Video Art Icon" class="toolbar-icon">
    </a>

    <!-- Photo Icon -->
    <a class="toolbar-link" href="photo.html" target="_parent">
      <img src="camera_directory.png" alt="Photo Icon" class="toolbar-icon">
    </a>

    <!-- About Icon -->
    <a class="toolbar-link" href="about.html" target="_parent">
      <img src="msagent-3.png" alt="About Icon" class="toolbar-icon">
    </a>

    <!-- CV Icon -->
    <a class="toolbar-link" href="cv.html" target="_parent">
      <img src="cv.png" alt="CV Icon" class="toolbar-icon">
    </a>

    <!-- Menu -->
    <div id="menu">
      <a href="library of alternative timekeeping/library_of_alternative_timekeeping.html" target="_parent">Library of Alternative Timekeeping</a>
      <a href="estate sale/estate_sale.html" target="_parent">Estate Sale</a>
      <a href="web_art.html" target="_parent">Web Art</a>
      <a href="video.html" target="_parent">Video</a>
      <a href="photo.html" target="_parent">Photo</a>
      <a href="about.html" target="_parent">About</a>
      <a href="cv.html" target="_parent">CV</a>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {

      const menuButton = document.getElementById('menuButton');
      const menu = document.getElementById('menu');
      const toolbar = document.getElementById('toolbar');

      let isMenuVisible = false;

      menuButton.addEventListener('click', () => {

        isMenuVisible = !isMenuVisible;

        menu.style.display = isMenuVisible ? 'block' : 'none';

        const toolbarHeight = toolbar.offsetHeight;

        window.parent.postMessage({
          type: 'menu',
          height: isMenuVisible
            ? menu.offsetHeight + toolbarHeight
            : toolbarHeight
        }, '*');

      });

      menu.querySelectorAll('a').forEach(item => {
        item.addEventListener('click', () => {
          menu.style.display = 'none';
          isMenuVisible = false;
        });
      });

    });
  </script>

</body>
</html>
